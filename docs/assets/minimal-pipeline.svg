<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280" role="img" aria-labelledby="title desc">
  <title id="title">ComfyUI-MV-Director 現行プロジェクト概要</title>
  <desc id="desc">人物・背景Vision、歌詞整列、Direction、Timeline Planner、Compilerから保存済みPlan JSONを作る第一段階と、同じPlanで動画生成段階だけを再実行できるMiniMax H3生成の第二段階を分離した全体図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526273"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <style>
      .canvas{fill:#f8fafc}.stage{fill:#fff;stroke:#cbd5e1;stroke-width:2}.input{fill:#fff4df;stroke:#b7791f;stroke-width:2}.node{fill:#e7f1ff;stroke:#3977b8;stroke-width:2}.py{fill:#eaf8ef;stroke:#3a8b58;stroke-width:2}.artifact{fill:#f2eafe;stroke:#7950a8;stroke-width:2}.save{fill:#fff0f1;stroke:#c24156;stroke-width:3}.target{fill:#263547;stroke:#152232;stroke-width:2}.edge{fill:none;stroke:#526273;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c3aed;stroke-width:3.5;stroke-dasharray:12 8;marker-end:url(#dashArrow)}.title{fill:#172333;font:700 28px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.stageTitle{fill:#334155;font:700 22px "Yu Gothic UI","Noto Sans JP",sans-serif}.label{fill:#25364a;font:700 18px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.small{fill:#526273;font:500 14px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.tiny{fill:#526273;font:500 12px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.white{fill:#fff;font:700 19px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.whiteSmall{fill:#dbe7f2;font:500 14px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.note{fill:#475569;font:600 15px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.edgeLabel{fill:#6d28d9;font:700 13px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:8;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1280" rx="18"/>
  <text class="title" x="1100" y="48">ComfyUI-MV-Director — 現行プロジェクト概要</text>

  <rect class="stage" x="28" y="82" width="2144" height="710" rx="18"/>
  <text class="stageTitle" x="54" y="118">Stage 1 — Plan / Compiler：認識・歌詞時刻・演出を固定して保存</text>

  <rect class="input" x="55" y="150" width="220" height="76" rx="12"/>
  <text class="label" x="165" y="181">人物参照画像</text>
  <text class="small" x="165" y="205">identity / Picture 1</text>
  <rect class="node" x="330" y="140" width="265" height="96" rx="12"/>
  <text class="label" x="462.5" y="176">Image to Subject EMD</text>
  <text class="small" x="462.5" y="202">subject_only / person</text>
  <rect class="artifact" x="650" y="150" width="245" height="76" rx="12"/>
  <text class="label" x="772.5" y="181">Concept EMD</text>
  <text class="small" x="772.5" y="205">Subject identity</text>
  <path class="edge" d="M275 188H330"/>
  <path class="edge" d="M595 188H650"/>

  <rect class="input" x="55" y="265" width="220" height="76" rx="12"/>
  <text class="label" x="165" y="296">背景参照画像</text>
  <text class="small" x="165" y="320">environment / Picture 2</text>
  <rect class="node" x="330" y="255" width="265" height="96" rx="12"/>
  <text class="label" x="462.5" y="291">Background Vision</text>
  <text class="small" x="462.5" y="317">scene_only / location</text>
  <rect class="artifact" x="650" y="265" width="245" height="76" rx="12"/>
  <text class="label" x="772.5" y="296">Scene EMD</text>
  <text class="small" x="772.5" y="320">環境・時刻baseline</text>
  <path class="edge" d="M275 303H330"/>
  <path class="edge" d="M595 303H650"/>

  <rect class="input" x="55" y="390" width="220" height="100" rx="12"/>
  <text class="label" x="165" y="421">歌詞 + vocal</text>
  <text class="small" x="165" y="447">plain lyrics / PCM</text>
  <text class="small" x="165" y="470">H3 Timing Profile</text>
  <rect class="node" x="330" y="385" width="265" height="110" rx="12"/>
  <text class="label" x="462.5" y="420">Lyric Segmentation</text>
  <text class="small" x="462.5" y="446">Whisper + VAD + targeted retry</text>
  <text class="small" x="462.5" y="470">Scene / lyric timeline</text>
  <rect class="artifact" x="650" y="390" width="245" height="100" rx="12"/>
  <text class="label" x="772.5" y="421">Template EMD</text>
  <text class="small" x="772.5" y="447">確定Scene時間枠</text>
  <text class="small" x="772.5" y="470">+ SRT</text>
  <path class="edge" d="M275 440H330"/>
  <path class="edge" d="M595 440H650"/>

  <rect class="input" x="650" y="550" width="245" height="100" rx="12"/>
  <text class="label" x="772.5" y="581">利用者希望</text>
  <text class="small" x="772.5" y="607">Style / Motion / Camera</text>
  <text class="small" x="772.5" y="630">外部profile EMD</text>

  <rect class="node" x="1000" y="150" width="285" height="225" rx="14"/>
  <text class="label" x="1142.5" y="185">Direction Enhancer</text>
  <text class="small" x="1142.5" y="216">concept_emd</text>
  <text class="small" x="1142.5" y="242">scene_emd</text>
  <text class="small" x="1142.5" y="278">利用者希望 + Profile</text>
  <text class="small" x="1142.5" y="316">全Scene共通方針を一回統合</text>
  <text class="tiny" x="1142.5" y="346">明示DirectionをVision baselineより優先</text>

  <path class="dash" d="M895 188H1000"/>
  <text class="edgeLabel" x="947" y="176">concept_emd</text>
  <path class="dash" d="M895 303H950V242H1000"/>
  <text class="edgeLabel" x="940" y="291">scene_emd</text>
  <path class="edge" d="M895 600H955V330H1000"/>

  <rect class="artifact" x="1000" y="415" width="285" height="90" rx="12"/>
  <text class="label" x="1142.5" y="448">MVD_DIRECTION_V3</text>
  <text class="small" x="1142.5" y="474">typed Direction + preview</text>
  <path class="edge" d="M1142.5 375V415"/>

  <rect class="node" x="1370" y="180" width="300" height="280" rx="14"/>
  <text class="label" x="1520" y="217">Timeline Planner v55</text>
  <text class="small" x="1520" y="248">条件付き Lyric Cue Discovery</text>
  <text class="small" x="1520" y="274">Visual Beats → Song Direction</text>
  <text class="small" x="1520" y="300">Shot Layout → Actions</text>
  <text class="small" x="1520" y="326">Action Audit → Cameras</text>
  <text class="small" x="1520" y="352">CUT/CONTINUE・H3格子</text>
  <text class="small" x="1520" y="378">作者台詞・lip-syncを構造合成</text>
  <text class="tiny" x="1520" y="418">合格Action / Camera自然文はAS IS</text>

  <path class="edge" d="M895 440H930V525H1325V405H1370"/>
  <text class="edgeLabel" x="1195" y="516">template_emd</text>
  <path class="edge" d="M1285 460H1325V370H1370"/>
  <text class="edgeLabel" x="1320" y="476">direction</text>
  <path class="dash" d="M895 188H930V132H1325V240H1370"/>
  <text class="edgeLabel" x="1180" y="146">concept_emd</text>
  <path class="dash" d="M895 303H930V395H1325V305H1370"/>
  <text class="edgeLabel" x="1180" y="389">scene_emd</text>

  <rect class="artifact" x="1730" y="210" width="210" height="92" rx="12"/>
  <text class="label" x="1835" y="245">完成EMD</text>
  <text class="small" x="1835" y="271">人が確認・編集可能</text>
  <path class="edge" d="M1670 256H1730"/>
  <rect class="node" x="1730" y="350" width="210" height="112" rx="12"/>
  <text class="label" x="1835" y="384">EMD Compiler</text>
  <text class="small" x="1835" y="410">Ref2VA構造化</text>
  <text class="small" x="1835" y="434">日本語自由文だけ英訳</text>
  <path class="edge" d="M1835 302V350"/>

  <rect class="save" x="1980" y="300" width="155" height="142" rx="14"/>
  <text class="label" x="2057.5" y="337">保存境界</text>
  <text class="small" x="2057.5" y="366">Plan JSON</text>
  <text class="small" x="2057.5" y="390">.txt handoff</text>
  <text class="tiny" x="2057.5" y="416">前段を再実行せず</text>
  <text class="tiny" x="2057.5" y="433">後段へ渡す</text>
  <path class="edge" d="M1940 406H1980"/>

  <rect class="py" x="1000" y="550" width="940" height="148" rx="14"/>
  <text class="label" x="1470" y="584">責務境界</text>
  <text class="small" x="1470" y="613">LLM：Vision観測、演出候補、Action監査、翻訳自由文</text>
  <text class="small" x="1470" y="639">Python：typed artifact、時間、slot、protocol、directive、JSON</text>
  <text class="small" x="1470" y="665">人物Picture 1と背景Picture 2は別authority・別H3 slot。不完全な必須出力は後段へ流さず停止</text>
  <text class="tiny" x="1470" y="687">成功cacheとINFOログで長い処理を追跡</text>

  <text class="note" x="1100" y="756">Stage 1の成果を固定し、同じ計画からVideo段階だけを安全に再実行する</text>

  <rect class="stage" x="28" y="824" width="2144" height="390" rx="18"/>
  <text class="stageTitle" x="54" y="860">Stage 2 — Video：保存済みPlanを再利用し、MiniMax H3の生成・Review・連結だけを実行</text>

  <rect class="save" x="55" y="905" width="220" height="104" rx="12"/>
  <text class="label" x="165" y="941">Compiled Plan JSON</text>
  <text class="small" x="165" y="967">Stage 1の.txt</text>
  <text class="small" x="165" y="990">方式ごとの対応Plan</text>

  <rect class="input" x="55" y="1040" width="220" height="104" rx="12"/>
  <text class="label" x="165" y="1074">生成時入力</text>
  <text class="small" x="165" y="1100">Picture 1 / Picture 2</text>
  <text class="small" x="165" y="1123">full mix / vocal PCM</text>

  <rect class="py" x="350" y="930" width="280" height="156" rx="12"/>
  <text class="label" x="490" y="966">Audio Pad Pair</text>
  <text class="small" x="490" y="992">Plan frame尺へPCM無音補完</text>
  <text class="label" x="490" y="1027">Scene Debug Splitter</text>
  <text class="small" x="490" y="1053">PlanとPCMを同範囲へ切出し</text>

  <rect class="input" x="720" y="885" width="330" height="92" rx="12"/>
  <text class="label" x="885" y="919">Video生成設定</text>
  <text class="small" x="885" y="946">Scene Seed / sampler / steps / Review</text>

  <rect class="target" x="720" y="1005" width="330" height="156" rx="14"/>
  <text class="white" x="885" y="1045">Context Loop / MiniMax H3</text>
  <text class="whiteSmall" x="885" y="1074">TurboLoRA → Attention Backend</text>
  <text class="whiteSmall" x="885" y="1100">→ Video/Audio Shift → Sampling</text>
  <text class="whiteSmall" x="885" y="1127">Scene生成・Review・連結</text>

  <rect class="artifact" x="1190" y="985" width="310" height="136" rx="14"/>
  <text class="label" x="1345" y="1023">生成された動画候補</text>
  <text class="small" x="1345" y="1051">保存Planの演出・歌詞・Cameraを使用</text>
  <text class="small" x="1345" y="1077">H3の生成結果を確認</text>
  <text class="small" x="1345" y="1103">segment / checkpoint / final</text>

  <rect class="py" x="1600" y="985" width="390" height="136" rx="14"/>
  <text class="label" x="1795" y="1023">必要ならStage 2だけ再Queue</text>
  <text class="small" x="1795" y="1051">保存済みPlanと前段成果を再利用</text>
  <text class="small" x="1795" y="1077">後段停止でもVision・Whisper・LLMを再実行しない</text>
  <text class="small" x="1795" y="1103">設定変更時は実在するVideoノード上で行う</text>

  <path class="edge" d="M275 957H350"/>
  <path class="edge" d="M275 1092C310 1092 310 1050 350 1050"/>
  <path class="edge" d="M630 1008H680V1083H720"/>
  <path class="edge" d="M885 977V1005"/>
  <path class="edge" d="M1050 1083H1190"/>
  <path class="edge" d="M1500 1053H1600"/>
  <path class="dash" d="M1795 1121V1175H885V1161"/>
  <text class="edgeLabel" x="1340" y="1164">同じPlanでVideo段階だけ再実行</text>

  <text class="note" x="1100" y="1246">前段から作り直す変更：歌詞・音源時刻・Direction・profile・Planner seed・Subject/Scene EMD・Compiler条件</text>
</svg>
