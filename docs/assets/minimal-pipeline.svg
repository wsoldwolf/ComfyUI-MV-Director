<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description">
  <title id="title">ComfyUI-MV-Director 最小パイプライン</title>
  <desc id="description">人物参照と背景参照を分離し、背景は計画時にScene EMDをDirectionとPlannerへ、動画生成時に環境専用PictureをH3へ直接渡す。CompilerがScene EMDから環境契約を生成する。歌詞、ボーカル、フルミックスから完全EMDとContext Loop Plan JSONを作る流れ、Compiler単独経路及びSRT単独出力も示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526273"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .lane { fill: #64748b; font: 600 18px "Yu Gothic UI", "Noto Sans JP", sans-serif; letter-spacing: .04em; }
      .node { fill: #e7f1ff; stroke: #3977b8; stroke-width: 2; }
      .input { fill: #fff4df; stroke: #b7791f; stroke-width: 2; }
      .artifact { fill: #eaf8ef; stroke: #3a8b58; stroke-width: 2; }
      .output { fill: #f2eafe; stroke: #7950a8; stroke-width: 2; }
      .target { fill: #263547; stroke: #152232; stroke-width: 2; }
      .title { fill: #172333; font: 700 22px "Yu Gothic UI", "Noto Sans JP", sans-serif; text-anchor: middle; }
      .label { fill: #25364a; font: 600 19px "Yu Gothic UI", "Noto Sans JP", sans-serif; text-anchor: middle; }
      .small { fill: #526273; font: 500 16px "Yu Gothic UI", "Noto Sans JP", sans-serif; text-anchor: middle; }
      .target-label { fill: #ffffff; font: 700 21px "Yu Gothic UI", "Noto Sans JP", sans-serif; text-anchor: middle; }
      .target-small { fill: #dbe7f2; font: 500 16px "Yu Gothic UI", "Noto Sans JP", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #526273; stroke-width: 3; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .edge-label { fill: #526273; font: 500 15px "Yu Gothic UI", "Noto Sans JP", sans-serif; text-anchor: middle; paint-order: stroke; stroke: #f8fafc; stroke-width: 7; stroke-linejoin: round; }
      .section { fill: none; stroke: #d2dae4; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1180" rx="18"/>
  <text class="title" x="800" y="44">ComfyUI-MV-Director — 選定した最小パイプライン</text>

  <text class="lane" x="45" y="82">入力</text>
  <text class="lane" x="325" y="82">解析・準備ノード</text>
  <text class="lane" x="675" y="82">中間成果</text>
  <text class="lane" x="1010" y="82">計画・コンパイル</text>
  <text class="lane" x="1360" y="82">Context Loop / H3</text>

  <rect class="section" x="22" y="94" width="1556" height="542" rx="16"/>
  <rect class="section" x="22" y="662" width="1556" height="430" rx="16"/>

  <!-- Image branch -->
  <rect class="input" x="45" y="120" width="220" height="72" rx="12"/>
  <text class="label" x="155" y="153">人物参照画像</text>
  <text class="small" x="155" y="178">identity専用</text>

  <rect class="node" x="325" y="108" width="300" height="96" rx="12"/>
  <text class="label" x="475" y="147">Image to Subject EMD</text>
  <text class="small" x="475" y="177">画像認識 + Picture自動束縛</text>

  <rect class="artifact" x="680" y="108" width="255" height="72" rx="12"/>
  <text class="label" x="807.5" y="139">サブジェクトEMD</text>
  <text class="small" x="807.5" y="164">&lt;Subject N&gt; ↔ &lt;Picture N&gt;</text>

  <rect class="artifact" x="680" y="198" width="255" height="72" rx="12"/>
  <text class="label" x="807.5" y="229">必要参照画像</text>
  <text class="small" x="807.5" y="254">同じIMAGE pass-through</text>

  <path class="edge" d="M265 156 H325"/>
  <path class="edge" d="M625 142 H680"/>
  <path class="edge" d="M625 174 C650 174 650 234 680 234"/>

  <!-- Direction branch -->
  <rect class="input" x="45" y="264" width="220" height="82" rx="12"/>
  <text class="label" x="155" y="298">短い希望</text>
  <text class="small" x="155" y="325">+ 演出プロファイル</text>

  <rect class="node" x="325" y="257" width="300" height="96" rx="12"/>
  <text class="label" x="475" y="296">Direction Enhancer</text>
  <text class="small" x="475" y="326">希望 + Scene EMD → 全体方針</text>

  <rect class="artifact" x="680" y="282" width="255" height="72" rx="12"/>
  <text class="label" x="807.5" y="326">Direction</text>

  <path class="edge" d="M265 305 H325"/>
  <path class="edge" d="M625 305 C650 305 650 318 680 318"/>

  <!-- Lyrics branch -->
  <rect class="input" x="45" y="410" width="220" height="72" rx="12"/>
  <text class="label" x="155" y="440">歌詞ファイル</text>
  <text class="small" x="155" y="465">TXT / LRC / SRT</text>

  <rect class="node" x="325" y="399" width="300" height="94" rx="12"/>
  <text class="label" x="475" y="438">Load Text File</text>
  <text class="small" x="475" y="468">選択 / D&amp;D → STRING</text>

  <rect class="input" x="45" y="523" width="220" height="72" rx="12"/>
  <text class="label" x="155" y="566">ボーカルステム</text>

  <rect class="node" x="680" y="400" width="255" height="142" rx="12"/>
  <text class="label" x="807.5" y="438">Lyric Segmentation</text>
  <text class="small" x="807.5" y="468">Whisper + VAD</text>
  <text class="small" x="807.5" y="493">H3長 / Scene / Shot</text>
  <text class="small" x="807.5" y="518">元音源msの歌詞位置</text>

  <rect class="output" x="680" y="564" width="255" height="54" rx="12"/>
  <text class="label" x="807.5" y="598">SRT（単独利用可）</text>

  <path class="edge" d="M265 446 H325"/>
  <path class="edge" d="M625 446 H680"/>
  <path class="edge" d="M265 559 C460 559 500 518 680 510"/>
  <path class="edge" d="M807.5 542 V564"/>

  <!-- Planner and Compiler -->
  <rect class="node" x="1010" y="174" width="280" height="142" rx="12"/>
  <text class="label" x="1150" y="215">Timeline Planner</text>
  <text class="small" x="1150" y="246">Template EMD + Timeline</text>
  <text class="small" x="1150" y="271">演出 + lip-sync directive</text>
  <text class="small" x="1150" y="296">→ 完全EMD</text>

  <path class="edge" d="M935 144 C970 144 972 207 1010 207"/>
  <path class="edge" d="M935 318 C972 318 972 273 1010 273"/>
  <path class="edge" d="M935 462 C982 462 982 300 1010 300"/>
  <text class="edge-label" x="968" y="426">Template EMD + Timeline</text>

  <rect class="input" x="680" y="690" width="255" height="72" rx="12"/>
  <text class="label" x="807.5" y="720">手書き完全EMD</text>
  <text class="small" x="807.5" y="745">Compiler単独経路</text>

  <rect class="node" x="1010" y="405" width="280" height="142" rx="12"/>
  <text class="label" x="1150" y="446">EMD Compiler</text>
  <text class="small" x="1150" y="476">Ref2VA専用 / as-is</text>
  <text class="small" x="1150" y="501">日本語描写だけ英訳</text>
  <text class="small" x="1150" y="526">六セクションへ直列化</text>

  <path class="edge" d="M1150 316 V405"/>
  <text class="edge-label" x="1198" y="365">完全EMD</text>
  <path class="edge-dashed" d="M935 726 C980 726 980 520 1010 520"/>

  <rect class="output" x="1360" y="402" width="205" height="72" rx="12"/>
  <text class="label" x="1462.5" y="432">Plan JSON</text>
  <text class="small" x="1462.5" y="458">Context Loop互換</text>

  <rect class="output" x="1360" y="495" width="205" height="72" rx="12"/>
  <text class="label" x="1462.5" y="525">固定artifact</text>
  <text class="small" x="1462.5" y="551">必要参照一覧</text>

  <path class="edge" d="M1290 449 C1325 449 1325 438 1360 438"/>
  <path class="edge" d="M1290 503 C1325 503 1325 531 1360 531"/>

  <!-- Audio branch -->
  <rect class="input" x="45" y="700" width="220" height="72" rx="12"/>
  <text class="label" x="155" y="730">フルミックス</text>
  <text class="small" x="155" y="755">最終音声</text>

  <rect class="input" x="45" y="798" width="220" height="72" rx="12"/>
  <text class="label" x="155" y="828">ボーカルステム</text>
  <text class="small" x="155" y="853">解析 / lip-sync用</text>

  <rect class="node" x="325" y="736" width="300" height="98" rx="12"/>
  <text class="label" x="475" y="776">Audio Pad Pair</text>
  <text class="small" x="475" y="806">短い側だけをPCM無音補完</text>

  <rect class="artifact" x="680" y="800" width="255" height="72" rx="12"/>
  <text class="label" x="807.5" y="830">H3 Audio Tracks</text>
  <text class="small" x="807.5" y="855">+ Source Timeline</text>

  <path class="edge" d="M265 736 C295 736 295 765 325 765"/>
  <path class="edge" d="M265 834 H325"/>
  <path class="edge" d="M625 785 C652 785 652 836 680 836"/>

  <!-- Separate background branch -->
  <rect class="input" x="45" y="910" width="220" height="82" rx="12"/>
  <text class="label" x="155" y="941">背景参照画像</text>
  <text class="small" x="155" y="968">人物画像とは別ファイル</text>

  <rect class="node" x="325" y="900" width="300" height="102" rx="12"/>
  <text class="label" x="475" y="932">Background Vision</text>
  <text class="small" x="475" y="958">計画時: scene_only / location</text>
  <text class="small" x="475" y="982">Picture束縛なし</text>

  <rect class="artifact" x="680" y="900" width="255" height="102" rx="12"/>
  <text class="label" x="807.5" y="932">Scene EMD</text>
  <text class="small" x="807.5" y="958">Directionへ環境証拠</text>
  <text class="small" x="807.5" y="982">人物Subjectへ結合しない</text>

  <rect class="node" x="1010" y="900" width="280" height="102" rx="12"/>
  <text class="label" x="1150" y="932">Compiler環境契約</text>
  <text class="small" x="1150" y="958">生成時: &lt;Picture 2&gt;</text>
  <text class="small" x="1150" y="982">環境条件を独立して保持</text>

  <path class="edge" d="M265 951 H325"/>
  <path class="edge" d="M625 951 H680"/>
  <path class="edge-dashed" d="M680 940 H650 V343 H625"/>
  <text class="edge-label" x="642" y="626">emd_fragment → scene_emd</text>
  <path class="edge-dashed" d="M265 980 V1050 H980 C1000 1050 1000 974 1010 974"/>
  <text class="edge-label" x="617" y="1042">同じ背景IMAGEをH3へ直接接続</text>
  <path class="edge" d="M1462.5 474 V1060 H1150 V1002"/>
  <text class="edge-label" x="1362" y="1052">Compiled Plan JSON</text>
  <path class="edge" d="M1150 900 V888"/>

  <!-- Final target -->
  <rect class="target" x="1110" y="760" width="455" height="128" rx="14"/>
  <text class="target-label" x="1337.5" y="808">Context Loop / MiniMax H3</text>
  <text class="target-label" x="1337.5" y="838">Ref2VA</text>
  <text class="target-small" x="1337.5" y="866">Plan JSON + 参照画像 + Source Timeline</text>

  <path class="edge" d="M935 234 C970 234 970 660 1045 660 H1380 C1405 660 1405 738 1405 760"/>
  <path class="edge" d="M935 836 H1110"/>

  <text class="small" x="800" y="1130">人物 &lt;Picture 1&gt; と背景 &lt;Picture 2&gt; を分離すると、人物identityによる条件占有を避けて背景再現率を高められる</text>
  <text class="small" x="800" y="1155">独立利用: 手書き完全EMD → Compiler ／ 画像なしサブジェクトEMD → Enhancer・Planner ／ Lyric Segmentation → SRT</text>
</svg>
