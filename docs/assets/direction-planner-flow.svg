<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">Direction EnhancerとTimeline Planner v64の処理フロー</title>
  <desc id="desc">Direction Enhancerが人物Concept、背景Scene、追加プロンプト、外部ProfileをMVD_DIRECTION_V3へ統合する。Timeline Planner v64は歌詞Cue、Visual Beats、Song Direction、Shot Layout、条件付きScene spine、Actions、Action Audit、Camerasを経て完成EMDを作る。LLM自然文のAS IS境界とPython所有処理を示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526273"/>
    </marker>
    <style>
      .canvas{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.input{fill:#fff4df;stroke:#b7791f;stroke-width:2}.llm{fill:#e7f1ff;stroke:#3977b8;stroke-width:2}.python{fill:#eaf8ef;stroke:#3a8b58;stroke-width:2}.artifact{fill:#f2eafe;stroke:#7950a8;stroke-width:2}.output{fill:#263547;stroke:#152232;stroke-width:2}.edge{fill:none;stroke:#526273;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#arrow)}.title{fill:#172333;font:700 28px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.section{fill:#334155;font:700 22px "Yu Gothic UI","Noto Sans JP",sans-serif}.label{fill:#25364a;font:700 18px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.small{fill:#526273;font:500 14px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.tiny{fill:#526273;font:500 12px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.white{fill:#fff;font:700 19px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.whiteSmall{fill:#dbe7f2;font:500 14px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle}.legend{fill:#475569;font:500 14px "Yu Gothic UI","Noto Sans JP",sans-serif}.edgeLabel{fill:#526273;font:600 13px "Yu Gothic UI","Noto Sans JP",sans-serif;text-anchor:middle;paint-order:stroke;stroke:#f8fafc;stroke-width:7;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1420" rx="18"/>
  <text class="title" x="900" y="48">Direction Enhancer → Timeline Planner v64</text>

  <rect class="input" x="450" y="70" width="22" height="18" rx="3"/><text class="legend" x="482" y="84">入力・外部EMD</text>
  <rect class="llm" x="650" y="70" width="22" height="18" rx="3"/><text class="legend" x="682" y="84">LLM task</text>
  <rect class="python" x="810" y="70" width="22" height="18" rx="3"/><text class="legend" x="842" y="84">決定的Python処理</text>
  <rect class="artifact" x="1030" y="70" width="22" height="18" rx="3"/><text class="legend" x="1062" y="84">typed artifact</text>

  <rect class="panel" x="30" y="115" width="1740" height="410" rx="18"/>
  <text class="section" x="55" y="150">1. Direction Enhancer — 全Scene共通のauthorityを一度だけ統合</text>

  <rect class="input" x="55" y="180" width="270" height="132" rx="12"/>
  <text class="label" x="190" y="214">入力authority</text>
  <text class="small" x="190" y="242">retention_policy / 追加プロンプト</text>
  <text class="small" x="190" y="266">Concept EMD = 人物identity</text>
  <text class="small" x="190" y="290">Scene EMD = 環境・時刻baseline</text>

  <rect class="input" x="55" y="335" width="270" height="142" rx="12"/>
  <text class="label" x="190" y="369">外部profile EMD</text>
  <text class="small" x="190" y="397">Style / Motion / Camera</text>
  <text class="small" x="190" y="421">planner_policy metadata</text>
  <text class="small" x="190" y="445">passthrough入力は空欄可</text>

  <rect class="python" x="390" y="235" width="280" height="176" rx="12"/>
  <text class="label" x="530" y="270">Profile loader + 構造検証</text>
  <text class="small" x="530" y="298">ID・subsection・metadata</text>
  <text class="small" x="530" y="322">locked section / retention</text>
  <text class="small" x="530" y="346">Scene EMDを厳格parse</text>
  <text class="small" x="530" y="370">明示DirectionをVisionより優先</text>
  <text class="tiny" x="530" y="394">authorityと構造はPython所有</text>

  <rect class="llm" x="745" y="235" width="285" height="176" rx="12"/>
  <text class="label" x="887.5" y="270">Direction LLM</text>
  <text class="small" x="887.5" y="298">未固定slotだけを生成</text>
  <text class="small" x="887.5" y="322">STYLE / ENVIRONMENT</text>
  <text class="small" x="887.5" y="346">TIME_LIGHTING / MOTION</text>
  <text class="small" x="887.5" y="370">CAMERA / OTHER</text>
  <text class="tiny" x="887.5" y="394">TYPE ⇥ SLOT ⇥ TEXT</text>

  <rect class="python" x="1105" y="215" width="290" height="216" rx="12"/>
  <text class="label" x="1250" y="250">Parser + 局所回復</text>
  <text class="small" x="1250" y="278">行protocolを厳密検証</text>
  <text class="small" x="1250" y="302">欠落slotだけを再要求</text>
  <text class="small" x="1250" y="326">locked profile本文を機械適用</text>
  <text class="small" x="1250" y="350">provenanceとprofile IDを保存</text>
  <text class="small" x="1250" y="374">preview EMDをrender</text>
  <text class="tiny" x="1250" y="402">成功結果だけをcache</text>

  <rect class="artifact" x="1470" y="245" width="245" height="156" rx="12"/>
  <text class="label" x="1592.5" y="280">MVD_DIRECTION_V3</text>
  <text class="small" x="1592.5" y="308">六方向 + profile ID</text>
  <text class="small" x="1592.5" y="332">retention + provenance</text>
  <text class="small" x="1592.5" y="356">planner_policy選択根拠</text>
  <text class="tiny" x="1592.5" y="382">+ direction_emd_preview</text>

  <path class="edge" d="M325 246H390"/>
  <path class="edge" d="M325 406H390"/>
  <path class="edge" d="M670 323H745"/>
  <path class="edge" d="M1030 323H1105"/>
  <path class="edge" d="M1395 323H1470"/>

  <rect class="panel" x="30" y="555" width="1740" height="815" rx="18"/>
  <text class="section" x="55" y="590">2. Timeline Planner v64 — 確定Scene時間枠へ歌詞固有のShot演出を展開</text>

  <rect class="input" x="55" y="625" width="250" height="210" rx="12"/>
  <text class="label" x="180" y="660">Planner入力</text>
  <text class="small" x="180" y="690">Template EMD + lyrics</text>
  <text class="small" x="180" y="714">Concept EMD = Subject roster</text>
  <text class="small" x="180" y="738">Scene EMD = spatial support</text>
  <text class="small" x="180" y="762">Direction artifact</text>
  <text class="small" x="180" y="786">lip-sync / model / seed</text>
  <text class="tiny" x="180" y="816">Scene絶対時間は上流で確定</text>

  <rect class="python" x="355" y="635" width="250" height="190" rx="12"/>
  <text class="label" x="480" y="670">Context準備</text>
  <text class="small" x="480" y="698">作者台詞をplaceholder保護</text>
  <text class="small" x="480" y="722">人物詳細をrosterへ短縮</text>
  <text class="small" x="480" y="746">Scene環境をspatial support化</text>
  <text class="small" x="480" y="770">scenes_per_batchへ分割</text>
  <text class="tiny" x="480" y="800">履歴窓とcall_seedを決定</text>

  <rect class="llm" x="665" y="625" width="250" height="112" rx="12"/>
  <text class="label" x="790" y="660">Lyric Cue Discovery</text>
  <text class="small" x="790" y="687">bounded + automatic時だけ</text>
  <text class="small" x="790" y="711">原文から具体物・場所・effect</text>

  <rect class="llm" x="665" y="760" width="250" height="112" rx="12"/>
  <text class="label" x="790" y="795">Visual Beats</text>
  <text class="small" x="790" y="822">9-field Cue Card</text>
  <text class="small" x="790" y="846">根拠・対象・配置・可視展開</text>

  <rect class="llm" x="970" y="625" width="250" height="112" rx="12"/>
  <text class="label" x="1095" y="660">Song Direction</text>
  <text class="small" x="1095" y="687">曲全体で一回</text>
  <text class="small" x="1095" y="711">感情曲線・energy・編集連続性</text>

  <rect class="llm" x="970" y="760" width="250" height="112" rx="12"/>
  <text class="label" x="1095" y="795">Shot Layout</text>
  <text class="small" x="1095" y="822">CUT / CONTINUE + 候補ID</text>
  <text class="small" x="1095" y="846">新しい時刻は生成しない</text>

  <rect class="python" x="1275" y="625" width="250" height="112" rx="12"/>
  <text class="label" x="1400" y="660">Layout適用</text>
  <text class="small" x="1400" y="687">候補repair・最大4 Shot</text>
  <text class="small" x="1400" y="711">H3格子へ時間再配分</text>

  <rect class="llm" x="1275" y="760" width="250" height="112" rx="12"/>
  <text class="label" x="1400" y="795">Scene spine</text>
  <text class="small" x="1400" y="822">条件付き・全Shot一括</text>
  <text class="small" x="1400" y="846">準備 → 一回のevent → 反応</text>

  <path class="dash" d="M1593 401V540H1740V605H180V625"/>
  <text class="edgeLabel" x="1635" y="594">typed Direction</text>
  <path class="edge" d="M305 730H355"/>
  <path class="edge" d="M605 680H665"/>
  <path class="edge" d="M790 737V760"/>
  <path class="edge" d="M915 816H970"/>
  <path class="dash" d="M605 680C635 680 635 600 1095 600V625"/>
  <path class="edge" d="M1095 737V760"/>
  <path class="edge" d="M1220 816H1247V681H1275"/>
  <path class="edge" d="M1400 737V760"/>

  <rect class="llm" x="355" y="930" width="275" height="130" rx="12"/>
  <text class="label" x="492.5" y="967">Actions</text>
  <text class="small" x="492.5" y="994">全身演技・表情・空間関係</text>
  <text class="small" x="492.5" y="1018">Cue可視展開・終端pose</text>
  <text class="tiny" x="492.5" y="1043">ACTION ⇥ SLOT ⇥ TEXT</text>

  <rect class="llm" x="690" y="930" width="275" height="130" rx="12"/>
  <text class="label" x="827.5" y="967">Action Audit</text>
  <text class="small" x="827.5" y="994">有限理由codeで分類</text>
  <text class="small" x="827.5" y="1018">該当slotだけ一回修復</text>
  <text class="tiny" x="827.5" y="1043">最大2 audit round・fail-open</text>

  <rect class="llm" x="1025" y="930" width="275" height="130" rx="12"/>
  <text class="label" x="1162.5" y="967">Cameras</text>
  <text class="small" x="1162.5" y="994">確定Actionをread-only参照</text>
  <text class="small" x="1162.5" y="1018">H3 Motion Type・Scene coverage</text>
  <text class="tiny" x="1162.5" y="1043">CAMERA ⇥ SLOT ⇥ TEXT</text>

  <rect class="python" x="1360" y="910" width="355" height="170" rx="12"/>
  <text class="label" x="1537.5" y="947">有限検証 + Renderer</text>
  <text class="small" x="1537.5" y="975">台詞復元・生成台詞除去</text>
  <text class="small" x="1537.5" y="999">Action → Camera → lyricsを配置</text>
  <text class="small" x="1537.5" y="1023">lip-sync directiveを機械挿入</text>
  <text class="small" x="1537.5" y="1047">単独末尾backslashだけを表示正規化</text>
  <text class="tiny" x="1537.5" y="1070">採用自然文の意味は変更しない</text>

  <path class="edge" d="M1400 872V895H492V930"/>
  <path class="edge" d="M630 995H690"/>
  <path class="edge" d="M965 995H1025"/>
  <path class="edge" d="M1300 995H1360"/>

  <rect class="python" x="55" y="1135" width="535" height="165" rx="12"/>
  <text class="label" x="322.5" y="1170">AS IS境界</text>
  <text class="small" x="322.5" y="1198">LLM：合格Action / Cameraの自然文</text>
  <text class="small" x="322.5" y="1222">Python：slot・時刻・構造・CUT/CONTINUE・directive</text>
  <text class="small" x="322.5" y="1246">監査予算枯渇：最小違反候補をAS ISで保持</text>
  <text class="tiny" x="322.5" y="1275">必須slot / protocol回復不能時だけCompiler前で停止</text>

  <rect class="python" x="645" y="1135" width="440" height="165" rx="12"/>
  <text class="label" x="865" y="1170">Sourceの分離</text>
  <text class="small" x="865" y="1198">歌詞：対象・場所・外部自律effect</text>
  <text class="small" x="865" y="1222">Scene EMD：認可対象の空間配置だけ</text>
  <text class="small" x="865" y="1246">Concept EMD：最終Subject定義だけ</text>
  <text class="tiny" x="865" y="1275">背景物・衣装・履物をAction主題へ昇格させない</text>

  <rect class="output" x="1150" y="1140" width="565" height="150" rx="14"/>
  <text class="white" x="1432.5" y="1180">完成EMD — MVD_EMD_V1</text>
  <text class="whiteSmall" x="1432.5" y="1208">Subject + Scene + Direction + Shot + lyrics + lip-sync</text>
  <text class="whiteSmall" x="1432.5" y="1234">編集可能なEasy MarkDown</text>
  <text class="whiteSmall" x="1432.5" y="1260">→ EMD Compiler (Ref2VA) → Plan JSON</text>
  <path class="edge" d="M1538 1080V1140"/>

  <text class="small" x="900" y="1335">長尺曲はscenes_per_batchで処理し、生成requestの履歴窓を制限しつつ、採用後の反復検査は全履歴を対象にする</text>
  <text class="small" x="900" y="1360">背景IMAGE tensorはPlannerへ渡さず、同じ背景画像を動画生成時のH3 Picture 2 slotへ直接接続する</text>
</svg>
