<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1220" viewBox="0 0 2000 1220" role="img" aria-labelledby="title desc">
<title id="title">Gemma4によるDirectionとScene Authorの現行処理フロー</title>
<desc id="desc">共通指示と演出候補を分離し、SceneごとにEvent、Performance、Cameraを順に生成する。明示Shot指示を保持し、profileによる補完と再選択を区別する。終端状態は継続Sceneだけへ引き継ぐ。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526273"/></marker></defs>
<style>text{font-family:"Yu Gothic UI",Meiryo,sans-serif;fill:#25364a;text-anchor:middle} .edge{fill:none;stroke:#526273;stroke-width:3;marker-end:url(#arrow)} .dash{stroke-dasharray:9 7}</style>
<rect width="2000" height="1220" fill="#f8fafc"/>
<text x="1000" y="44" font-size="30" font-weight="700">Direction Enhancer → Scene Author → EMD Compiler</text>
<text x="1000" y="78" font-size="21" font-weight="400">現行dev WF：Gemma4 31B Q4_K_S / Motion = anime_scene_composed_mv</text>
<text x="1000" y="112" font-size="18" font-weight="400">橙：入力　青：LLM　緑：Python　紫：保存・受け渡す成果</text>
<rect x="40" y="150" width="370" height="165" rx="14" fill="#fff4df" stroke="#b7791f" stroke-width="2"/>
<text x="225.0" y="184" font-size="23" font-weight="700">入力とprofile</text>
<text x="225.0" y="214" font-size="19" font-weight="400">人物Concept / 背景Scene EMD</text>
<text x="225.0" y="241" font-size="19" font-weight="400"># 共通プロンプト / # 演出候補</text>
<text x="225.0" y="268" font-size="19" font-weight="400">Style / Motion / Camera profile</text>
<rect x="470" y="150" width="400" height="165" rx="14" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2"/>
<text x="670.0" y="184" font-size="23" font-weight="700">構文・authorityを分離</text>
<text x="670.0" y="214" font-size="19" font-weight="400">共通指示はDirectionへ</text>
<text x="670.0" y="241" font-size="19" font-weight="400">演出候補は原文のまま迂回</text>
<text x="670.0" y="268" font-size="19" font-weight="400">明示指示をVision baselineより優先</text>
<rect x="930" y="150" width="410" height="165" rx="14" fill="#e7f1ff" stroke="#3977b8" stroke-width="2"/>
<text x="1135.0" y="184" font-size="23" font-weight="700">Direction Enhancer · 31B</text>
<text x="1135.0" y="214" font-size="19" font-weight="400">未固定の全体方針だけを生成</text>
<text x="1135.0" y="241" font-size="19" font-weight="400">locked profileはPythonが保持</text>
<text x="1135.0" y="268" font-size="19" font-weight="400">行protocol検証・欠落の局所retry</text>
<rect x="1400" y="150" width="550" height="165" rx="14" fill="#f2eafe" stroke="#7950a8" stroke-width="2"/>
<text x="1675.0" y="184" font-size="23" font-weight="700">MVD_DIRECTION_V4</text>
<text x="1675.0" y="214" font-size="19" font-weight="400">全体方針 / profile / provenance</text>
<text x="1675.0" y="241" font-size="19" font-weight="400">演出候補の原文を別フィールドで保持</text>
<text x="1675.0" y="268" font-size="19" font-weight="400">+ 編集用Direction preview EMD</text>
<path class="edge" d="M410 232H470"/>
<path class="edge" d="M870 232H930"/>
<path class="edge" d="M1340 232H1400"/>
<path class="edge dash" d="M670 315V345H1675V315"/>
<text x="1110" y="338" font-size="17" font-weight="400">演出候補はDirection LLMへ投入しない</text>
<rect x="40" y="410" width="370" height="210" rx="14" fill="#fff4df" stroke="#b7791f" stroke-width="2"/>
<text x="225.0" y="444" font-size="23" font-weight="700">Scene入力</text>
<text x="225.0" y="474" font-size="19" font-weight="400">歌詞整列済みTemplate EMD</text>
<text x="225.0" y="501" font-size="19" font-weight="400">Scene / Shot / 歌詞時刻</text>
<text x="225.0" y="528" font-size="19" font-weight="400">Concept / Scene EMD / Direction</text>
<text x="225.0" y="555" font-size="19" font-weight="400">ユーザー確定Shot指示</text>
<text x="225.0" y="582" font-size="19" font-weight="400">H3 Timing Profile / seed</text>
<rect x="470" y="410" width="400" height="210" rx="14" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2"/>
<text x="670.0" y="444" font-size="23" font-weight="700">Sceneごとに準備</text>
<text x="670.0" y="474" font-size="19" font-weight="400">現在Scene + 歌詞section文脈</text>
<text x="670.0" y="501" font-size="19" font-weight="400">Shot位置と時刻を保持</text>
<text x="670.0" y="528" font-size="19" font-weight="400">固定の演出・演技・Cameraを保護</text>
<text x="670.0" y="555" font-size="19" font-weight="400">CONTINUE時だけ前Scene状態</text>
<text x="670.0" y="582" font-size="19" font-weight="400">候補：optional / prefer_matched</text>
<path class="edge" d="M410 515H470"/>
<path class="edge dash" d="M1675 315V370H670V410"/>
<rect x="930" y="410" width="410" height="210" rx="14" fill="#e7f1ff" stroke="#3977b8" stroke-width="2"/>
<text x="1135.0" y="444" font-size="23" font-weight="700">1. EVENT · 31B</text>
<text x="1135.0" y="474" font-size="19" font-weight="400">出来事・対象・外部effectを計画</text>
<text x="1135.0" y="501" font-size="19" font-weight="400">歌詞と演出候補を参照</text>
<text x="1135.0" y="528" font-size="19" font-weight="400">全Shotを一Sceneとして要求</text>
<text x="1135.0" y="555" font-size="19" font-weight="400">採用Eventを後段へ明示</text>
<text x="1135.0" y="582" font-size="19" font-weight="400">末尾END_STATEを分離・記録</text>
<rect x="1400" y="410" width="550" height="210" rx="14" fill="#e7f1ff" stroke="#3977b8" stroke-width="2"/>
<text x="1675.0" y="444" font-size="23" font-weight="700">2. PERFORMANCE · 31B</text>
<text x="1675.0" y="474" font-size="19" font-weight="400">Eventを読んで身体・表情を計画</text>
<text x="1675.0" y="501" font-size="19" font-weight="400">演出候補とMotion方針も参照</text>
<text x="1675.0" y="528" font-size="19" font-weight="400">固定演技のShotは生成しない</text>
<text x="1675.0" y="555" font-size="19" font-weight="400">LLM原文は保持</text>
<text x="1675.0" y="582" font-size="19" font-weight="400">演技の終端状態を記録</text>
<path class="edge" d="M870 515H930"/>
<path class="edge" d="M1340 515H1400"/>
<rect x="1400" y="710" width="550" height="190" rx="14" fill="#e7f1ff" stroke="#3977b8" stroke-width="2"/>
<text x="1675.0" y="744" font-size="23" font-weight="700">3. CAMERA · 31B</text>
<text x="1675.0" y="774" font-size="19" font-weight="400">採用Eventと演技に合わせて撮影</text>
<text x="1675.0" y="801" font-size="19" font-weight="400">Camera方針 / 演出候補を参照</text>
<text x="1675.0" y="828" font-size="19" font-weight="400">固定CameraのShotは生成しない</text>
<text x="1675.0" y="855" font-size="19" font-weight="400">Cameraの終端状態を記録</text>
<rect x="930" y="710" width="410" height="190" rx="14" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2"/>
<text x="1135.0" y="744" font-size="23" font-weight="700">任意のモーション補完</text>
<text x="1135.0" y="774" font-size="19" font-weight="400">profileが有効化したSceneだけ</text>
<text x="1135.0" y="801" font-size="19" font-weight="400">pre_author / post_authorを区別</text>
<text x="1135.0" y="828" font-size="19" font-weight="400">必要時だけLLMで候補を再選択</text>
<text x="1135.0" y="855" font-size="19" font-weight="400">直接指定された確定演技は保護</text>
<rect x="470" y="710" width="400" height="190" rx="14" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2"/>
<text x="670.0" y="744" font-size="23" font-weight="700">検証・Renderer</text>
<text x="670.0" y="774" font-size="19" font-weight="400">構造grammar + 有限retry</text>
<text x="670.0" y="801" font-size="19" font-weight="400">LLM原文と補完の出所を区別</text>
<text x="670.0" y="828" font-size="19" font-weight="400">時刻 / 参照 / 歌詞を構造統合</text>
<text x="670.0" y="855" font-size="19" font-weight="400">歌唱・lip-sync directiveを配置</text>
<rect x="40" y="710" width="370" height="190" rx="14" fill="#f2eafe" stroke="#7950a8" stroke-width="2"/>
<text x="225.0" y="744" font-size="23" font-weight="700">完成EMD</text>
<text x="225.0" y="774" font-size="19" font-weight="400">演出 / 演技 / Camera</text>
<text x="225.0" y="801" font-size="19" font-weight="400">モーション補完注釈・歌詞時刻</text>
<text x="225.0" y="828" font-size="19" font-weight="400">Subject / Scene / Direction</text>
<text x="225.0" y="855" font-size="19" font-weight="400">利用者が確認・編集可能</text>
<path class="edge" d="M1675 620V710"/>
<path class="edge" d="M1400 805H1340"/>
<path class="edge" d="M930 805H870"/>
<path class="edge" d="M470 805H410"/>
<path class="edge dash" d="M1950 805H1975V950H445V390H670V410"/>
<text x="915" y="940" font-size="18" font-weight="400">CONTINUE：Event / Performance / Cameraの終端状態を次Sceneへ</text>
<rect x="40" y="1000" width="830" height="150" rx="14" fill="#e7f1ff" stroke="#3977b8" stroke-width="2"/>
<text x="455.0" y="1034" font-size="23" font-weight="700">EMD Compiler · 31B</text>
<text x="455.0" y="1064" font-size="19" font-weight="400">翻訳対象fieldのみ英訳 / 予約directiveは機械処理</text>
<text x="455.0" y="1091" font-size="19" font-weight="400">構造検証 → Context Loop Plan JSON → .txt保存境界</text>
<text x="455.0" y="1118" font-size="19" font-weight="400">Video段階：H3 Hybrid Loader + Context Loop標準Lip Sync</text>
<path class="edge" d="M225 900V1000"/>
<rect x="930" y="1000" width="1020" height="150" rx="14" fill="#f2eafe" stroke="#7950a8" stroke-width="2"/>
<text x="1440.0" y="1034" font-size="23" font-weight="700">経路の区別</text>
<text x="1440.0" y="1064" font-size="19" font-weight="400">図は現行Scene Author経路。旧Cue / Visual Beat / Actions / Auditは別経路</text>
<text x="1440.0" y="1091" font-size="19" font-weight="400">任意の候補再選択は監査分類器ではなく、既存の補完候補を選び直す処理</text>
<text x="1440.0" y="1118" font-size="19" font-weight="400">必須protocol回復不能時は停止。自然さ・演出・同期の最終判定は人間</text>
<text x="1000" y="1190" font-size="18" font-weight="400">時刻契約：Context Loop 0.7.0 @ d80304f / ComfyUI 0.37.2 @ 830232b</text>
