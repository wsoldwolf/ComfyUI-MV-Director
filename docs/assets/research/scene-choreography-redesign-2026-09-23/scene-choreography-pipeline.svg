<svg xmlns="http://www.w3.org/2000/svg" width="2260" height="1650" viewBox="0 0 2260 1650" role="img" aria-labelledby="title desc">
<title id="title">Scene振付の再設計：通常経路（提案）</title>
<desc id="desc">同じ8Bを順次呼び出し、出来事、最終振付原文、撮影と時間割当をScene単位で計画する。出来事と演技の原文は保存され、撮影担当は参照で割り当てる。Pythonは原文参照と時刻を検証してEMDへ出力する。採用した終端を次Sceneへ渡す。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3977b8"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#248458"/></marker>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7950a8"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b7791f"/></marker>
<style>text{font-family:"Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif} .edge-label{paint-order:stroke;stroke:#f8fafc;stroke-width:10;stroke-linejoin:round}</style>
</defs>
<rect width="2260" height="1650" fill="#f8fafc"/>
<text x="1130" y="57" text-anchor="middle" font-size="38" font-weight="700" fill="#172333">Scene振付の再設計 ─ 通常経路</text>
<text x="1130" y="99" text-anchor="middle" font-size="23" font-weight="400" fill="#475569">提案・未実装  /  同じ8Bを順次使用  /  全自動時は通常3呼出しが目標  /  手書き確定範囲は生成を省略</text>
<rect x="160" y="140" width="26" height="22" rx="4" fill="#fff4df" stroke="#b7791f" stroke-width="2"/>
<text x="199" y="158" text-anchor="start" font-size="22" font-weight="400" fill="#475569">原資料</text>
<rect x="490" y="140" width="26" height="22" rx="4" fill="#e7f1ff" stroke="#3977b8" stroke-width="2"/>
<text x="529" y="158" text-anchor="start" font-size="22" font-weight="400" fill="#475569">LLM：生成・選択</text>
<rect x="930" y="140" width="26" height="22" rx="4" fill="#f2eafe" stroke="#7950a8" stroke-width="2"/>
<text x="969" y="158" text-anchor="start" font-size="22" font-weight="400" fill="#475569">原文・計画の保存</text>
<rect x="1410" y="140" width="26" height="22" rx="4" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2"/>
<text x="1449" y="158" text-anchor="start" font-size="22" font-weight="400" fill="#475569">Python：構造処理</text>
<rect x="1870" y="140" width="26" height="22" rx="4" fill="#263547" stroke="#152232" stroke-width="2"/>
<text x="1909" y="158" text-anchor="start" font-size="22" font-weight="400" fill="#475569">完成物</text>
<rect x="100" y="215" width="2000" height="150" rx="16" fill="#fff4df" stroke="#b7791f" stroke-width="2.5"/>
<text x="1100.0" y="258" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">Scene N の原資料（共通EMD解析・ユーザー優先の解決結果）</text>
<text x="1100.0" y="299" text-anchor="middle" font-size="25" font-weight="400" fill="#25364a">原歌詞・時刻・Scene尺  /  作者の共通指示・任意候補・確定本文  /  人物・背景  /  profile既定値</text>
<text x="1100.0" y="335" text-anchor="middle" font-size="25" font-weight="400" fill="#25364a">前Sceneの採用済み終端：身体・支持位置・残る現象・Camera方向</text>
<path d="M1100,365 L1100,435" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M350,435 L1850,435" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M350,435 L350,515" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1100,435 L1100,515" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1850,435 L1850,515" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text class="edge-label" x="740" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#3977b8">原文を直接入力</text>
<rect x="100" y="515" width="500" height="220" rx="16" fill="#e7f1ff" stroke="#3977b8" stroke-width="2.5"/>
<text x="350.0" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">A  出来事・解釈</text>
<text x="350.0" y="599" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">歌詞をどう見せるかを決める</text>
<text x="350.0" y="635" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">対象の配置・変化・必要な接触</text>
<text x="350.0" y="671" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">出力：出来事原文 E（対象なしも可）</text>
<text x="350.0" y="707" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">作者の確定項目は再生成しない</text>
<rect x="850" y="515" width="500" height="220" rx="16" fill="#e7f1ff" stroke="#3977b8" stroke-width="2.5"/>
<text x="1100.0" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">B  Scene全体の振付</text>
<text x="1100.0" y="599" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">原歌詞 + Motion + 出来事 E を読む</text>
<text x="1100.0" y="635" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">始点 → 身体の進行 → 終端</text>
<text x="1100.0" y="671" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">出力：最終演技原文 B と終端状態</text>
<text x="1100.0" y="707" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">未指定の演技だけを生成する</text>
<rect x="1600" y="515" width="500" height="220" rx="16" fill="#e7f1ff" stroke="#3977b8" stroke-width="2.5"/>
<text x="1850.0" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">C  撮影・時間割当</text>
<text x="1850.0" y="599" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">出来事 E と演技 B の原文を読む</text>
<text x="1850.0" y="635" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">見せ場に合わせてShot・Cameraを設計</text>
<text x="1850.0" y="671" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">出力：参照・時刻・Camera原文</text>
<text x="1850.0" y="707" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">作者の固定Camera・時刻も守る</text>
<path d="M600,622 L850,622" fill="none" stroke="#7950a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text class="edge-label" x="725" y="593" text-anchor="middle" font-size="22" font-weight="600" fill="#7950a8">E を参照</text>
<path d="M1350,622 L1600,622" fill="none" stroke="#7950a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text class="edge-label" x="1475" y="580" text-anchor="middle" font-size="22" font-weight="600" fill="#7950a8">E + B を参照</text>
<text class="edge-label" x="1475" y="660" text-anchor="middle" font-size="21" font-weight="400" fill="#7950a8">原文のまま</text>
<path d="M350,735 L350,865" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1100,735 L1100,865" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="725" y="809" text-anchor="middle" font-size="24" font-weight="600" fill="#248458">生成時に原文を保存</text>
<path d="M1850,735 L1850,865" fill="none" stroke="#7950a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text class="edge-label" x="1850" y="809" text-anchor="middle" font-size="23" font-weight="600" fill="#7950a8">撮影・割当結果を保存</text>
<rect x="100" y="865" width="1250" height="165" rx="16" fill="#f2eafe" stroke="#7950a8" stroke-width="2.5"/>
<text x="725.0" y="908" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">出来事・演技の原文ストア</text>
<text x="725.0" y="949" text-anchor="middle" font-size="25" font-weight="400" fill="#25364a">E：出来事原文   /   B：演技原文   /   作者本文も保持   /   出典・範囲・revision</text>
<text x="725.0" y="986" text-anchor="middle" font-size="25" font-weight="400" fill="#25364a">撮影LLMの要約を経由せず、保存した文章をEMDへ直接渡す</text>
<rect x="1600" y="865" width="500" height="165" rx="16" fill="#f2eafe" stroke="#7950a8" stroke-width="2.5"/>
<text x="1850.0" y="908" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">SceneSchedule</text>
<text x="1850.0" y="949" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">Shot時刻 + E/Bの参照</text>
<text x="1850.0" y="986" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">Camera原文 + 継続方法・終端</text>
<path d="M725,1030 L725,1085 L1000,1085 L1000,1135" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text class="edge-label" x="655" y="1080" text-anchor="middle" font-size="22" font-weight="600" fill="#248458">E/B原文</text>
<path d="M1850,1030 L1850,1085 L1300,1085 L1300,1135" fill="none" stroke="#7950a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text class="edge-label" x="1620" y="1070" text-anchor="middle" font-size="22" font-weight="600" fill="#7950a8">参照・時刻・Camera</text>
<rect x="850" y="1135" width="600" height="165" rx="16" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2.5"/>
<text x="1150.0" y="1178" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">Python：検証・原文参照の解決</text>
<text x="1150.0" y="1219" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">ID・順序・時刻・revisionを検証</text>
<text x="1150.0" y="1257" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">選ばれた原文をそのまま並べる（AS IS）</text>
<path d="M1450,1217 L1600,1217" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="1600" y="1135" width="500" height="165" rx="16" fill="#263547" stroke="#152232" stroke-width="2.5"/>
<text x="1850.0" y="1178" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Scene N を採用</text>
<text x="1850.0" y="1219" text-anchor="middle" font-size="23" font-weight="400" fill="#ffffff">EMD + trace + 採用済み終端</text>
<text x="1850.0" y="1257" text-anchor="middle" font-size="23" font-weight="400" fill="#ffffff">Scene単位で保存・再開可能</text>
<path d="M2100,1217 L2185,1217 L2185,290 L2100,290" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<text x="2140" y="815" text-anchor="middle" font-size="24" font-weight="600" fill="#475569">次</text>
<text x="2140" y="850" text-anchor="middle" font-size="24" font-weight="600" fill="#475569">の</text>
<text x="2140" y="885" text-anchor="middle" font-size="22" font-weight="600" fill="#475569">Scene</text>
<text x="2140" y="920" text-anchor="middle" font-size="24" font-weight="600" fill="#475569">へ</text>
<path d="M1850,1300 L1850,1345 L350,1345 L350,1395" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<text class="edge-label" x="610" y="1334" text-anchor="middle" font-size="23" font-weight="600" fill="#475569">全Sceneが揃ったら出力</text>
<rect x="100" y="1395" width="500" height="120" rx="16" fill="#263547" stroke="#152232" stroke-width="2.5"/>
<text x="350.0" y="1438" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">完成EMD</text>
<text x="350.0" y="1479" text-anchor="middle" font-size="23" font-weight="400" fill="#ffffff">出来事・演技・Cameraの原文</text>
<path d="M600,1455 L850,1455" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<rect x="850" y="1395" width="500" height="120" rx="16" fill="#e7f1ff" stroke="#3977b8" stroke-width="2.5"/>
<text x="1100.0" y="1438" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">Compiler（LLM + Python）</text>
<text x="1100.0" y="1479" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">英訳・H3 Plan JSON・翻訳trace</text>
<path d="M1350,1455 L1600,1455" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<rect x="1600" y="1395" width="500" height="120" rx="16" fill="#263547" stroke="#152232" stroke-width="2.5"/>
<text x="1850.0" y="1438" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">H3 動画生成</text>
<text x="1850.0" y="1479" text-anchor="middle" font-size="23" font-weight="400" fill="#ffffff">同条件の短区間比較で品質を確認</text>
<text x="1100" y="1575" text-anchor="middle" font-size="24" font-weight="600" fill="#248458">緑の経路：採用原文を保持して運ぶ。作者の手書き本文は別図の共通入力経路から直接採用できる。</text>
<text x="1100" y="1615" text-anchor="middle" font-size="22" font-weight="400" fill="#475569">全手書きならA/B/Cを省略。ユーザー優先はCompilerまで共通契約として適用する。</text>
</svg>
