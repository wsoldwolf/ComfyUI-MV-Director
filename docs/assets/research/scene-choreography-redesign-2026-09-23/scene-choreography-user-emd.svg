<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1590" viewBox="0 0 2100 1590" role="img" aria-labelledby="title desc">
<title id="title">ユーザーEMD優先の共通解析と部分生成（提案）</title>
<desc id="desc">既存ユーザーEMD、profile、観測と歌詞を共通構造で解析し、項目と適用範囲ごとに優先を解決する。確定本文は直接保持し、未指定項目だけを生成する。任意の演出候補は選択対象であり強制命令ではない。Compilerも同じ解決結果を使う。</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3977b8"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#248458"/></marker>
<marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7950a8"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b7791f"/></marker>
<style>text{font-family:"Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif} .edge-label{paint-order:stroke;stroke:#f8fafc;stroke-width:10;stroke-linejoin:round}</style>
</defs>
<rect width="2100" height="1590" fill="#f8fafc"/>
<text x="1050" y="56" text-anchor="middle" font-size="38" font-weight="700" fill="#172333">ユーザーEMDを中心にした共通契約</text>
<text x="1050" y="98" text-anchor="middle" font-size="23" font-weight="400" fill="#475569">提案・未実装  /  既存の入力口を共通化  /  部分手書きと全自動を併用  /  内部IDの記入は不要</text>
<rect x="100" y="175" width="500" height="205" rx="16" fill="#fff4df" stroke="#b7791f" stroke-width="2.5"/>
<text x="350.0" y="218" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">ユーザーEMD</text>
<text x="350.0" y="259" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">共通指示 / 任意の演出候補</text>
<text x="350.0" y="297" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">Scene・Shotの確定本文と時刻</text>
<text x="350.0" y="335" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">既存入力・passthrough・再編集</text>
<rect x="800" y="175" width="500" height="205" rx="16" fill="#fff4df" stroke="#b7791f" stroke-width="2.5"/>
<text x="1050.0" y="218" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">profile</text>
<text x="1050.0" y="259" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">共通する本文は同じ文法で解析</text>
<text x="1050.0" y="297" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">画風・Motion・Cameraの既定値</text>
<text x="1050.0" y="335" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">計画用メタデータは専用検証</text>
<rect x="1500" y="175" width="500" height="205" rx="16" fill="#fff4df" stroke="#b7791f" stroke-width="2.5"/>
<text x="1750.0" y="218" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">歌詞・観測・継続状態</text>
<text x="1750.0" y="259" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">原歌詞 / 時刻 / Visionの観測</text>
<text x="1750.0" y="297" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">前Sceneの採用済み終端</text>
<text x="1750.0" y="335" text-anchor="middle" font-size="23" font-weight="400" fill="#25364a">観測を作者の演出命令と混同しない</text>
<path d="M350,380 L350,475" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<path d="M1050,380 L1050,475" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<path d="M1750,380 L1750,475" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-grey)"/>
<rect x="100" y="475" width="1900" height="215" rx="16" fill="#eaf8ef" stroke="#3a8b58" stroke-width="2.5"/>
<text x="1050.0" y="518" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">共通EMD parser + 用途別validator + 項目・適用範囲ごとの優先解決</text>
<text x="1050.0" y="559" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">競合する演出項目：作者の明示指定 ＞ profileの既定値 ＞ LLM補完　（構造・H3契約は別に検証）</text>
<text x="1050.0" y="598" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">出典・範囲・本文の用途を保持。確定本文 / 生成指示 / 任意候補を区別する。</text>
<text x="1050.0" y="637" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">構造化項目の本文ブロックで上書き。自然文の意味をPythonで推測して切り貼りしない。</text>
<path d="M400,690 L400,820" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text class="edge-label" x="400" y="761" text-anchor="middle" font-size="24" font-weight="600" fill="#248458">確定済みの本文</text>
<path d="M1650,690 L1650,820" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text class="edge-label" x="1650" y="754" text-anchor="middle" font-size="23" font-weight="600" fill="#3977b8">有効指示・候補・固定条件</text>
<text class="edge-label" x="1650" y="786" text-anchor="middle" font-size="22" font-weight="400" fill="#3977b8">未指定項目がある場合だけ</text>
<rect x="100" y="820" width="600" height="225" rx="16" fill="#f2eafe" stroke="#7950a8" stroke-width="2.5"/>
<text x="400.0" y="863" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">作者の原文を直接保持</text>
<text x="400.0" y="904" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">演技だけ / Cameraだけの固定も可能</text>
<text x="400.0" y="942" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">LLM監査でも無断で書き換えない</text>
<text x="400.0" y="980" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">全手書きなら生成A/B/Cを省略</text>
<text x="400.0" y="1018" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">再生成したい項目を未指定へ戻せる</text>
<rect x="1300" y="820" width="700" height="225" rx="16" fill="#e7f1ff" stroke="#3977b8" stroke-width="2.5"/>
<text x="1650.0" y="863" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">未指定部分の生成</text>
<text x="1650.0" y="904" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">A：出来事 / B：振付 / C：撮影・割当</text>
<text x="1650.0" y="942" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">全担当が作者の固定条件を先に読む</text>
<text x="1650.0" y="980" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">任意候補は選択・展開・不採用が可能</text>
<text x="1650.0" y="1018" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">生成結果は作者の確定欄を置き換えない</text>
<path d="M400,1045 L400,1115 L850,1115 L850,1175" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1650,1045 L1650,1115 L1250,1115 L1250,1175" fill="none" stroke="#3977b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="650" y="1175" width="800" height="150" rx="16" fill="#f2eafe" stroke="#7950a8" stroke-width="2.5"/>
<text x="1050.0" y="1218" text-anchor="middle" font-size="28" font-weight="700" fill="#25364a">共通のScene成果物 → 完成EMD</text>
<text x="1050.0" y="1259" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">採用原文・出典・範囲・revision・hashを保存</text>
<text x="1050.0" y="1296" text-anchor="middle" font-size="24" font-weight="400" fill="#25364a">再編集時は依存する生成部分だけを再計画</text>
<path d="M1050,1325 L1050,1400" fill="none" stroke="#248458" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="200" y="1400" width="1700" height="140" rx="16" fill="#263547" stroke="#152232" stroke-width="2.5"/>
<text x="1050.0" y="1443" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Compilerも同じ優先解決を使用 → H3 Plan</text>
<text x="1050.0" y="1484" text-anchor="middle" font-size="24" font-weight="400" fill="#ffffff">局所上書きと競合するprofile文を共通prefixへ残さない。翻訳・最終promptまで出典を追跡する。</text>
<text x="1050.0" y="1518" text-anchor="middle" font-size="24" font-weight="400" fill="#ffffff">語義の完全な一致と映像での再現は別途検証する。原文保持だけで品質を保証しない。</text>
</svg>
